<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaleidoscope Mix Studio (120 FPS Optimized)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f3f4f6;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Live FPS Counter */
    #fps-badge {
      position: fixed;
      top: 0.85rem;
      right: 0.95rem;
      background: rgba(10, 12, 22, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #a7f3d0;
      font-family: monospace;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
      z-index: 15;
      pointer-events: none;
      display: none;
    }
    #fps-badge.visible { display: block; }

    /* Setup Overlay */
    #setup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 7, 14, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 20;
      transition: opacity 0.25s ease;
    }
    #setup-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .studio-panel {
      width: 100%;
      max-width: 880px;
      max-height: 92vh;
      overflow-y: auto;
      background: #111422;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 1.65rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }
    .studio-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .studio-header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .studio-header p {
      font-size: 0.88rem;
      color: #9ca3af;
      margin-top: 0.2rem;
    }
    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(99, 102, 241, 0.22);
      border: 1px solid rgba(129, 140, 248, 0.55);
      color: #e0e7ff;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .upload-btn:hover { background: rgba(99, 102, 241, 0.38); }
    #image-input { display: none; }

    /* Items Grid */
    .section-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 0.75rem;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.35rem;
    }
    .item-card {
      position: relative;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .item-card.enabled {
      border-color: rgba(168, 85, 247, 0.65);
      background: rgba(168, 85, 247, 0.09);
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-preview {
      width: 100%;
      height: 74px;
      border-radius: 8px;
      background: #0b0d17;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .item-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .item-preview svg {
      width: 40px;
      height: 40px;
      stroke: #c084fc;
      fill: none;
      stroke-width: 1.75;
    }
    .item-name {
      font-size: 0.84rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
    }
    .key-bind-btn {
      background: #1f2438;
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #f9fafb;
      font-family: monospace;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.26rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
      min-width: 54px;
      text-align: center;
    }
    .key-bind-btn.listening {
      border-color: #f472b6;
      background: rgba(244, 114, 182, 0.25);
      color: #fbcfe8;
    }
    .remove-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 0.25rem;
    }
    .remove-btn:hover { color: #f87171; }

    /* Mix Options Row */
    .mix-settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 0.9rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.95rem;
      border-radius: 12px;
      margin-bottom: 1.35rem;
    }
    .setting-box {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.83rem;
    }
    .setting-box label { color: #d1d5db; font-weight: 500; }
    .setting-box select, .setting-box input[type="range"] {
      background: #1f2438;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.42rem;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: 100%;
      cursor: pointer;
    }
    .start-btn {
      width: 100%;
      padding: 0.88rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
      cursor: pointer;
    }
    .start-btn:hover { filter: brightness(1.08); }

    /* Live Mode HUD (No backdrop-filter for maximum GPU FPS) */
    #live-hud {
      position: fixed;
      bottom: 0.95rem;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      background: rgba(11, 13, 24, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.55rem 0.85rem;
      border-radius: 14px;
      z-index: 10;
      max-width: 96vw;
    }
    #live-hud.visible { display: flex; }
    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      padding: 0.32rem 0.62rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.8rem;
      color: #d1d5db;
      cursor: pointer;
      user-select: none;
    }
    .hud-pill.active {
      background: rgba(168, 85, 247, 0.36);
      border-color: #d8b4fe;
      color: #fff;
    }
    .hud-key {
      background: rgba(0, 0, 0, 0.5);
      padding: 0.1rem 0.36rem;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 700;
      color: #f9a8d4;
    }
    .hud-action {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      padding: 0.36rem 0.68rem;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .hud-action:hover { background: rgba(255, 255, 255, 0.22); }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>
  <div id="fps-badge">120 FPS</div>

  <!-- Pre-Start Configuration Overlay -->
  <div id="setup-overlay">
    <div class="studio-panel">
      <div class="studio-header">
        <div>
          <h1>Kaleidoscope Mix Studio</h1>
          <p>Select geometric objects, add your own images, and assign keyboard keys to mix them in the tunnel loop.</p>
        </div>
        <label class="upload-btn" for="image-input">
          + Add Images
          <input id="image-input" type="file" accept="image/*" multiple />
        </label>
      </div>

      <div class="section-label">Objects &amp; Uploaded Images (Click Key Button to Rebind)</div>
      <div class="items-grid" id="items-grid"></div>

      <div class="mix-settings">
        <div class="setting-box">
          <label class="checkbox-row">
            <input type="checkbox" id="auto-loop-toggle" checked />
            Auto-Cycle Loop (Crossfade)
          </label>
        </div>
        <div class="setting-box">
          <label for="mix-mode-select">Key Trigger Mode</label>
          <select id="mix-mode-select">
            <option value="blend">Blend Mix (Layer up to 3)</option>
            <option value="solo">Solo Switch (1 at a time)</option>
          </select>
        </div>
        <div class="setting-box">
          <label for="segments-select">Kaleidoscope Mirrors</label>
          <select id="segments-select">
            <option value="6">6 Segments</option>
            <option value="8" selected>8 Segments</option>
            <option value="12">12 Segments</option>
            <option value="16">16 Segments</option>
          </select>
        </div>
        <div class="setting-box">
          <label for="scale-select">Render Resolution (FPS)</label>
          <select id="scale-select">
            <option value="0.65">Max 120 FPS Boost (65%)</option>
            <option value="0.8" selected>Ultra Smooth (80%)</option>
            <option value="1.0">Native Full Res (100%)</option>
          </select>
        </div>
        <div class="setting-box">
          <label for="speed-range">Tunnel &amp; Color Speed</label>
          <input type="range" id="speed-range" min="0.15" max="1.2" step="0.05" value="0.45" />
        </div>
      </div>

      <button class="start-btn" id="start-btn">Start Kaleidoscope Mix</button>
    </div>
  </div>

  <!-- Live Keyboard & Mix HUD -->
  <div id="live-hud"></div>

  <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
  </script>

  <script id="fragment-shader" type="x-shader/x-fragment">
    precision highp float;
    uniform vec2 u_resolution;
    uniform float u_time;
    uniform float u_speed;
    uniform float u_segments;
    uniform float u_palBlend;

    // Precomputed per-layer rotation matrices (eliminates 4x per-pixel sin/cos)
    uniform mat2 u_rot0;
    uniform mat2 u_rot1;
    uniform mat2 u_rot2;
    uniform mat2 u_rot3;

    // 3-Slot Visual Mixer Uniforms
    uniform int u_type0;
    uniform float u_shape0;
    uniform float u_weight0;
    uniform sampler2D u_tex0;

    uniform int u_type1;
    uniform float u_shape1;
    uniform float u_weight1;
    uniform sampler2D u_tex1;

    uniform int u_type2;
    uniform float u_shape2;
    uniform float u_weight2;
    uniform sampler2D u_tex2;

    vec3 getSlowColor(float t) {
      vec3 c1 = 0.5 + 0.5 * cos(6.283185 * (t + vec3(0.263, 0.416, 0.557)));
      vec3 c2 = 0.5 + 0.5 * cos(6.283185 * (vec3(1.0, 0.7, 0.4) * t + vec3(0.0, 0.15, 0.20)));
      return mix(c1, c2, u_palBlend);
    }

    // Fast 2D Geometric SDFs
    float sdCircle(vec2 p, float r) {
      return length(p) - r;
    }

    float sdHexagon(vec2 p, float r) {
      const vec3 k = vec3(-0.8660254, 0.5, 0.57735027);
      p = abs(p);
      p -= 2.0 * min(dot(k.xy, p), 0.0) * k.xy;
      p -= vec2(clamp(p.x, -k.z * r, k.z * r), r);
      return length(p) * sign(p.y);
    }

    float sdDiamond(vec2 p, float r) {
      // 45-degree rotation without matrix multiply
      vec2 q = abs(vec2(p.x - p.y, p.x + p.y) * 0.70710678);
      vec2 d = q - vec2(r * 0.75);
      return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
    }

    float sdTriangle(vec2 p, float r) {
      const float k = 1.7320508;
      p.x = abs(p.x) - r;
      p.y = p.y + r / k;
      if (p.x + k * p.y > 0.0) {
        p = vec2(p.x - k * p.y, -k * p.x - p.y) * 0.5;
      }
      p.x -= clamp(p.x, -2.0 * r, 0.0);
      return -length(p) * sign(p.y);
    }

    float sdStar(vec2 p, float r) {
      float d1 = sdTriangle(p, r * 0.95);
      float d2 = sdTriangle(vec2(p.x, -p.y), r * 0.95);
      return min(d1, d2);
    }

    // Chebyshev polynomial cos(6a) — avoids expensive atan() + cos()
    float sdLotus(vec2 p, float r) {
      float len = length(p) + 0.00001;
      float c = p.x / len;
      float c3 = (4.0 * c * c - 3.0) * c;
      float cos6a = 2.0 * c3 * c3 - 1.0;
      return len - (r + 0.038 * cos6a);
    }

    float evalShape(vec2 p, float r, float id) {
      if (id < 0.5) return sdCircle(p, r);
      if (id < 1.5) return sdHexagon(p, r * 0.88);
      if (id < 2.5) return sdDiamond(p, r * 0.92);
      if (id < 3.5) return sdTriangle(p, r * 0.95);
      if (id < 4.5) return sdStar(p, r * 0.95);
      return sdLotus(p, r * 0.9);
    }

    // Fast algebraic glow falloff (replaces expensive pow(x, 1.2))
    vec3 renderShapeGlow(vec2 p, float shapeId, vec3 col, float timePhase) {
      float d = abs(sin(evalShape(p, 0.16, shapeId) * 14.0 - timePhase)) * 0.07142857;
      float g = 0.0075 / (d + 0.0012);
      return col * (g * inversesqrt(inversesqrt(g + 0.0001)));
    }

    vec3 styleTexture(vec4 texel, vec3 col) {
      vec3 tinted = mix(texel.rgb, texel.rgb * col * 1.9, 0.45);
      return tinted * texel.a * 0.42;
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
      uv += vec2(sin(u_time * 0.22), cos(u_time * 0.17)) * 0.05;

      float radius = length(uv);
      float angle = atan(uv.y, uv.x);

      float slice = 6.2831853 / u_segments;
      angle = abs(mod(angle, slice) - slice * 0.5);

      float depth = 0.55 / (radius + 0.1) - u_time * u_speed;

      vec2 p = vec2(
        abs(fract(depth) - 0.5) * 2.0 - 0.5,
        abs(fract(angle / slice) - 0.5) * 2.0 - 0.5
      );

      vec3 finalColor = vec3(0.0);
      float timePhase = u_time * 1.1;
      float baseColorPhase = depth * 0.12 + u_time * 0.05;
      vec2 texDrift = vec2(0.0, u_time * 0.05);

      for (int i = 0; i < 4; i++) {
        if (i == 0) p = u_rot0 * p;
        else if (i == 1) p = u_rot1 * p;
        else if (i == 2) p = u_rot2 * p;
        else p = u_rot3 * p;

        p = abs(fract(p * 1.35) - 0.5) - 0.25;

        float fi = float(i);
        vec3 col = getSlowColor(baseColorPhase + fi * 0.22);
        vec2 texUV = p * 2.1 + 0.5 + texDrift + vec2(fi * 0.17, 0.0);

        if (u_weight0 > 0.002) {
          vec3 layer0 = (u_type0 == 0)
            ? renderShapeGlow(p, u_shape0, col, timePhase)
            : styleTexture(texture2D(u_tex0, texUV), col);
          finalColor += layer0 * u_weight0;
        }

        if (u_weight1 > 0.002) {
          vec3 layer1 = (u_type1 == 0)
            ? renderShapeGlow(p, u_shape1, col, timePhase)
            : styleTexture(texture2D(u_tex1, texUV), col);
          finalColor += layer1 * u_weight1;
        }

        if (u_weight2 > 0.002) {
          vec3 layer2 = (u_type2 == 0)
            ? renderShapeGlow(p, u_shape2, col, timePhase)
            : styleTexture(texture2D(u_tex2, texUV), col);
          finalColor += layer2 * u_weight2;
        }
      }

      finalColor = finalColor / (1.0 + finalColor * 0.18);

      float tunnelCenter = smoothstep(0.0, 0.32, radius);
      vec3 horizonGlow = getSlowColor(u_time * 0.05 + 0.5) * (1.0 - tunnelCenter) * 0.65;
      finalColor = finalColor * tunnelCenter + horizonGlow;

      gl_FragColor = vec4(finalColor, 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById('glcanvas');
    // High-performance WebGL context with alpha/depth/stencil disabled
    const gl = canvas.getContext('webgl', {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      powerPreference: 'high-performance'
    });

    let renderScale = 0.8;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const effectiveScale = dpr * renderScale;
      canvas.width = Math.max(320, Math.floor(window.innerWidth * effectiveScale));
      canvas.height = Math.max(240, Math.floor(window.innerHeight * effectiveScale));
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, document.getElementById('vertex-shader').text));
    gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, document.getElementById('fragment-shader').text));
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

    const posLoc = gl.getAttribLocation(program, 'position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    // Cache all uniform locations once
    const uLoc = {
      resolution: gl.getUniformLocation(program, 'u_resolution'),
      time: gl.getUniformLocation(program, 'u_time'),
      speed: gl.getUniformLocation(program, 'u_speed'),
      segments: gl.getUniformLocation(program, 'u_segments'),
      palBlend: gl.getUniformLocation(program, 'u_palBlend'),
      rot0: gl.getUniformLocation(program, 'u_rot0'),
      rot1: gl.getUniformLocation(program, 'u_rot1'),
      rot2: gl.getUniformLocation(program, 'u_rot2'),
      rot3: gl.getUniformLocation(program, 'u_rot3'),
      type0: gl.getUniformLocation(program, 'u_type0'),
      shape0: gl.getUniformLocation(program, 'u_shape0'),
      weight0: gl.getUniformLocation(program, 'u_weight0'),
      tex0: gl.getUniformLocation(program, 'u_tex0'),
      type1: gl.getUniformLocation(program, 'u_type1'),
      shape1: gl.getUniformLocation(program, 'u_shape1'),
      weight1: gl.getUniformLocation(program, 'u_weight1'),
      tex1: gl.getUniformLocation(program, 'u_tex1'),
      type2: gl.getUniformLocation(program, 'u_type2'),
      shape2: gl.getUniformLocation(program, 'u_shape2'),
      weight2: gl.getUniformLocation(program, 'u_weight2'),
      tex2: gl.getUniformLocation(program, 'u_tex2')
    };

    function createFallbackTexture() {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([255, 255, 255, 255]));
      return tex;
    }
    const fallbackTex = createFallbackTexture();

    // Scale uploaded images to 512x512 POT with hardware MIRRORED_REPEAT + mipmaps
    const offscreenCanvas = document.createElement('canvas');
    offscreenCanvas.width = 512;
    offscreenCanvas.height = 512;
    const offscreenCtx = offscreenCanvas.getContext('2d');

    function createTextureFromImage(img) {
      offscreenCtx.clearRect(0, 0, 512, 512);
      offscreenCtx.drawImage(img, 0, 0, 512, 512);

      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, offscreenCanvas);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.generateMipmap(gl.TEXTURE_2D);
      return tex;
    }

    const shapeSVGs = [
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>',
      '<svg viewBox="0 0 24 24"><polygon points="12,3 20,7.5 20,16.5 12,21 4,16.5 4,7.5"/></svg>',
      '<svg viewBox="0 0 24 24"><polygon points="12,3 21,12 12,21 3,12"/></svg>',
      '<svg viewBox="0 0 24 24"><polygon points="12,4 21,19 3,19"/></svg>',
      '<svg viewBox="0 0 24 24"><polygon points="12,3 19,17 5,17"/><polygon points="12,21 19,7 5,7"/></svg>',
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="6" r="3"/><circle cx="17" cy="9" r="3"/><circle cx="17" cy="15" r="3"/><circle cx="12" cy="18" r="3"/><circle cx="7" cy="15" r="3"/><circle cx="7" cy="9" r="3"/></svg>'
    ];

    const deck = [
      { id: 's0', name: 'Circle', type: 'shape', shapeId: 0, key: 'Q', enabled: true, weight: 1.0, targetWeight: 1.0 },
      { id: 's1', name: 'Hexagon', type: 'shape', shapeId: 1, key: 'W', enabled: true, weight: 0.0, targetWeight: 0.0 },
      { id: 's2', name: 'Diamond', type: 'shape', shapeId: 2, key: 'E', enabled: true, weight: 0.0, targetWeight: 0.0 },
      { id: 's3', name: 'Triangle', type: 'shape', shapeId: 3, key: 'R', enabled: true, weight: 0.0, targetWeight: 0.0 },
      { id: 's4', name: '6-Point Star', type: 'shape', shapeId: 4, key: 'T', enabled: false, weight: 0.0, targetWeight: 0.0 },
      { id: 's5', name: 'Lotus Mandala', type: 'shape', shapeId: 5, key: 'Y', enabled: false, weight: 0.0, targetWeight: 0.0 }
    ];

    const defaultImageKeys = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'Z', 'X', 'C', 'V', 'B', 'N', 'M'];
    let listeningItemId = null;
    let isStarted = false;
    let autoLoop = true;
    let mixMode = 'blend';
    let tunnelSpeed = 0.45;
    let tunnelSegments = 8.0;
    let manualOverrideTimer = 0;

    // Cache settings in memory so render loop never touches DOM
    const speedInput = document.getElementById('speed-range');
    const segmentsSelect = document.getElementById('segments-select');
    const scaleSelect = document.getElementById('scale-select');
    const autoLoopToggle = document.getElementById('auto-loop-toggle');
    const mixModeSelect = document.getElementById('mix-mode-select');

    speedInput.addEventListener('input', () => { tunnelSpeed = parseFloat(speedInput.value); });
    segmentsSelect.addEventListener('change', () => { tunnelSegments = parseFloat(segmentsSelect.value); });
    scaleSelect.addEventListener('change', () => {
      renderScale = parseFloat(scaleSelect.value);
      resize();
    });

    const itemsGrid = document.getElementById('items-grid');
    const setupOverlay = document.getElementById('setup-overlay');
    const liveHud = document.getElementById('live-hud');
    const fpsBadge = document.getElementById('fps-badge');

    function renderSetupGrid() {
      itemsGrid.innerHTML = '';
      deck.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'item-card' + (item.enabled ? ' enabled' : '');

        const top = document.createElement('div');
        top.className = 'item-top';

        const toggleLabel = document.createElement('label');
        toggleLabel.style.cssText = 'display:flex;align-items:center;gap:0.4rem;font-size:0.8rem;cursor:pointer;';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = item.enabled;
        cb.addEventListener('change', () => {
          item.enabled = cb.checked;
          if (!item.enabled) item.targetWeight = 0;
          renderSetupGrid();
        });
        toggleLabel.appendChild(cb);
        toggleLabel.appendChild(document.createTextNode('In Mix'));
        top.appendChild(toggleLabel);

        if (item.type === 'image') {
          const rm = document.createElement('button');
          rm.className = 'remove-btn';
          rm.textContent = '×';
          rm.title = 'Remove image';
          rm.addEventListener('click', () => {
            const idx = deck.indexOf(item);
            if (idx > -1) deck.splice(idx, 1);
            renderSetupGrid();
          });
          top.appendChild(rm);
        }

        const preview = document.createElement('div');
        preview.className = 'item-preview';
        if (item.type === 'shape') {
          preview.innerHTML = shapeSVGs[item.shapeId];
        } else {
          const imgEl = document.createElement('img');
          imgEl.src = item.thumbUrl;
          preview.appendChild(imgEl);
        }

        const controls = document.createElement('div');
        controls.className = 'item-controls';

        const nameEl = document.createElement('span');
        nameEl.className = 'item-name';
        nameEl.textContent = item.name;

        const keyBtn = document.createElement('button');
        keyBtn.className = 'key-bind-btn' + (listeningItemId === item.id ? ' listening' : '');
        keyBtn.textContent = listeningItemId === item.id ? 'Press Key' : `Key: ${item.key}`;
        keyBtn.addEventListener('click', () => {
          listeningItemId = item.id;
          renderSetupGrid();
        });

        controls.appendChild(nameEl);
        controls.appendChild(keyBtn);

        card.appendChild(top);
        card.appendChild(preview);
        card.appendChild(controls);
        itemsGrid.appendChild(card);
      });
    }

    document.getElementById('image-input').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const texture = createTextureFromImage(img);
            const usedKeys = new Set(deck.map((d) => d.key));
            const nextKey = defaultImageKeys.find((k) => !usedKeys.has(k)) || '1';
            deck.push({
              id: 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
              name: file.name.replace(/\.[^/.]+$/, ''),
              type: 'image',
              texture: texture,
              thumbUrl: ev.target.result,
              key: nextKey,
              enabled: true,
              weight: 0.0,
              targetWeight: 0.0
            });
            renderSetupGrid();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    });

    let hudPillMap = new Map();
    let lastActiveSignature = '';

    function buildLiveHud() {
      liveHud.innerHTML = '';
      hudPillMap.clear();
      lastActiveSignature = '';

      const activeItems = deck.filter((d) => d.enabled);
      activeItems.forEach((item) => {
        const pill = document.createElement('div');
        pill.className = 'hud-pill' + (item.targetWeight > 0.25 ? ' active' : '');
        pill.innerHTML = `<span class="hud-key">${item.key}</span><span>${item.name}</span>`;
        pill.addEventListener('click', () => triggerItem(item));
        liveHud.appendChild(pill);
        hudPillMap.set(item.id, pill);
      });

      const autoBtn = document.createElement('button');
      autoBtn.className = 'hud-action';
      autoBtn.textContent = autoLoop ? 'Auto-Loop: ON' : 'Auto-Loop: OFF';
      autoBtn.addEventListener('click', () => {
        autoLoop = !autoLoop;
        autoLoopToggle.checked = autoLoop;
        buildLiveHud();
      });
      liveHud.appendChild(autoBtn);

      const editBtn = document.createElement('button');
      editBtn.className = 'hud-action';
      editBtn.textContent = 'Edit Mix (Esc)';
      editBtn.addEventListener('click', openSetup);
      liveHud.appendChild(editBtn);
    }

    // Only updates DOM when active highlight state actually changes
    function syncHudHighlight() {
      let sig = '';
      for (let i = 0; i < deck.length; i++) {
        if (deck[i].targetWeight > 0.25) sig += deck[i].id + ',';
      }
      if (sig === lastActiveSignature) return;
      lastActiveSignature = sig;

      hudPillMap.forEach((pill, id) => {
        const item = deck.find((d) => d.id === id);
        if (item) {
          pill.classList.toggle('active', item.targetWeight > 0.25);
        }
      });
    }

    function openSetup() {
      isStarted = false;
      setupOverlay.classList.remove('hidden');
      liveHud.classList.remove('visible');
      fpsBadge.classList.remove('visible');
      renderSetupGrid();
    }

    function startMix() {
      if (!deck.some((d) => d.enabled)) {
        deck[0].enabled = true;
      }
      autoLoop = autoLoopToggle.checked;
      mixMode = mixModeSelect.value;
      tunnelSpeed = parseFloat(speedInput.value);
      tunnelSegments = parseFloat(segmentsSelect.value);
      renderScale = parseFloat(scaleSelect.value);
      resize();

      const enabledItems = deck.filter((d) => d.enabled);
      deck.forEach((d) => (d.targetWeight = 0));
      enabledItems[0].targetWeight = 1.0;

      isStarted = true;
      listeningItemId = null;
      setupOverlay.classList.add('hidden');
      liveHud.classList.add('visible');
      fpsBadge.classList.add('visible');
      buildLiveHud();
    }

    document.getElementById('start-btn').addEventListener('click', startMix);

    function triggerItem(targetItem) {
      if (!targetItem.enabled) targetItem.enabled = true;
      manualOverrideTimer = 4.5;

      if (mixMode === 'solo') {
        deck.forEach((item) => {
          item.targetWeight = item.id === targetItem.id ? 1.0 : 0.0;
        });
      } else {
        if (targetItem.targetWeight > 0.5) {
          const activeCount = deck.filter((d) => d.targetWeight > 0.2).length;
          if (activeCount > 1) targetItem.targetWeight = 0.0;
        } else {
          targetItem.targetWeight = 1.0;
          const active = deck.filter((d) => d.targetWeight > 0.2);
          if (active.length > 3) {
            const oldest = active.find((d) => d.id !== targetItem.id);
            if (oldest) oldest.targetWeight = 0.0;
          }
        }
      }
      syncHudHighlight();
    }

    window.addEventListener('keydown', (e) => {
      if (listeningItemId) {
        e.preventDefault();
        if (e.key !== 'Escape') {
          const cleanKey = e.key.length === 1 ? e.key.toUpperCase() : e.code.replace('Key', '').replace('Digit', '');
          const item = deck.find((d) => d.id === listeningItemId);
          if (item && cleanKey) item.key = cleanKey;
        }
        listeningItemId = null;
        renderSetupGrid();
        return;
      }

      if (e.key === 'Escape' && isStarted) {
        openSetup();
        return;
      }

      if (!isStarted) return;

      if (e.code === 'Space') {
        e.preventDefault();
        autoLoop = !autoLoop;
        autoLoopToggle.checked = autoLoop;
        buildLiveHud();
        return;
      }

      const pressed = e.key.toUpperCase();
      const matched = deck.find((item) => item.key.toUpperCase() === pressed);
      if (matched) triggerItem(matched);
    });

    renderSetupGrid();

    // Pre-allocated Float32Arrays for rotation matrices to avoid garbage collection
    const rotMats = [
      new Float32Array(4),
      new Float32Array(4),
      new Float32Array(4),
      new Float32Array(4)
    ];
    const rotUniformLocs = [uLoc.rot0, uLoc.rot1, uLoc.rot2, uLoc.rot3];

    let lastTime = 0;
    let loopPhase = 0;
    let fpsFrames = 0;
    let fpsLastUpdate = 0;

    function render(now) {
      requestAnimationFrame(render);

      // Pause heavy GPU rendering while Setup Studio is covering the screen
      if (!isStarted) {
        lastTime = now * 0.001;
        return;
      }

      const timeSec = now * 0.001;
      const dt = Math.min(0.1, timeSec - lastTime);
      lastTime = timeSec;

      // Update FPS badge twice per second
      fpsFrames++;
      if (now - fpsLastUpdate >= 500) {
        const fps = Math.round((fpsFrames * 1000) / (now - fpsLastUpdate));
        fpsBadge.textContent = `${fps} FPS`;
        fpsFrames = 0;
        fpsLastUpdate = now;
      }

      if (manualOverrideTimer > 0) {
        manualOverrideTimer -= dt;
      }

      const enabledItems = deck.filter((d) => d.enabled);

      if (autoLoop && manualOverrideTimer <= 0 && enabledItems.length > 1) {
        loopPhase += dt * 0.28;
        const count = enabledItems.length;
        const idxA = Math.floor(loopPhase) % count;
        const idxB = (idxA + 1) % count;
        const frac = loopPhase - Math.floor(loopPhase);
        const blend = frac * frac * (3.0 - 2.0 * frac);

        for (let i = 0; i < deck.length; i++) deck[i].targetWeight = 0;
        enabledItems[idxA].targetWeight = 1.0 - blend * 0.7;
        enabledItems[idxB].targetWeight = blend;
        syncHudHighlight();
      }

      const lerpFactor = Math.min(1.0, dt * 4.5);
      for (let i = 0; i < deck.length; i++) {
        deck[i].weight += (deck[i].targetWeight - deck[i].weight) * lerpFactor;
      }

      // Find top 3 active items without array allocations
      let s0 = null, s1 = null, s2 = null;
      for (let i = 0; i < deck.length; i++) {
        const item = deck[i];
        if (item.weight <= 0.002) continue;
        if (!s0 || item.weight > s0.weight) {
          s2 = s1; s1 = s0; s0 = item;
        } else if (!s1 || item.weight > s1.weight) {
          s2 = s1; s1 = item;
        } else if (!s2 || item.weight > s2.weight) {
          s2 = item;
        }
      }

      // Compute 4 rotation matrices on CPU once per frame
      for (let i = 0; i < 4; i++) {
        const a = timeSec * 0.1 + i * 0.45;
        const s = Math.sin(a);
        const c = Math.cos(a);
        const m = rotMats[i];
        m[0] = c; m[1] = -s; m[2] = s; m[3] = c;
        gl.uniformMatrix2fv(rotUniformLocs[i], false, m);
      }

      gl.uniform2f(uLoc.resolution, canvas.width, canvas.height);
      gl.uniform1f(uLoc.time, timeSec);
      gl.uniform1f(uLoc.speed, tunnelSpeed);
      gl.uniform1f(uLoc.segments, tunnelSegments);
      gl.uniform1f(uLoc.palBlend, 0.5 + 0.5 * Math.sin(timeSec * 0.09));

      // Bind Slot 0
      gl.activeTexture(gl.TEXTURE0);
      if (s0) {
        gl.bindTexture(gl.TEXTURE_2D, s0.type === 'image' ? s0.texture : fallbackTex);
        gl.uniform1i(uLoc.tex0, 0);
        gl.uniform1i(uLoc.type0, s0.type === 'image' ? 1 : 0);
        gl.uniform1f(uLoc.shape0, s0.shapeId || 0);
        gl.uniform1f(uLoc.weight0, s0.weight);
      } else {
        gl.bindTexture(gl.TEXTURE_2D, fallbackTex);
        gl.uniform1f(uLoc.weight0, 0.0);
      }

      // Bind Slot 1
      gl.activeTexture(gl.TEXTURE1);
      if (s1) {
        gl.bindTexture(gl.TEXTURE_2D, s1.type === 'image' ? s1.texture : fallbackTex);
        gl.uniform1i(uLoc.tex1, 1);
        gl.uniform1i(uLoc.type1, s1.type === 'image' ? 1 : 0);
        gl.uniform1f(uLoc.shape1, s1.shapeId || 0);
        gl.uniform1f(uLoc.weight1, s1.weight);
      } else {
        gl.bindTexture(gl.TEXTURE_2D, fallbackTex);
        gl.uniform1f(uLoc.weight1, 0.0);
      }

      // Bind Slot 2
      gl.activeTexture(gl.TEXTURE2);
      if (s2) {
        gl.bindTexture(gl.TEXTURE_2D, s2.type === 'image' ? s2.texture : fallbackTex);
        gl.uniform1i(uLoc.tex2, 2);
        gl.uniform1i(uLoc.type2, s2.type === 'image' ? 1 : 0);
        gl.uniform1f(uLoc.shape2, s2.shapeId || 0);
        gl.uniform1f(uLoc.weight2, s2.weight);
      } else {
        gl.bindTexture(gl.TEXTURE_2D, fallbackTex);
        gl.uniform1f(uLoc.weight2, 0.0);
      }

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
